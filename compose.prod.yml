services:
  db:
    image: postgres:16-alpine
    container_name: blend-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: blend_crm
      POSTGRES_USER: blend_crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blend_crm -d blend_crm"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: blend-crm-migrator:latest
    environment:
      DATABASE_URL: postgresql://blend_crm:${POSTGRES_PASSWORD}@db:5432/blend_crm
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: blend-crm-web:latest
    container_name: blend-crm-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://blend_crm:${POSTGRES_PASSWORD}@db:5432/blend_crm
      LEAD_INGEST_API_KEY: ${LEAD_INGEST_API_KEY:?LEAD_INGEST_API_KEY is required}
      WEBFLOW_WEBHOOK_TOKEN: ${WEBFLOW_WEBHOOK_TOKEN:?WEBFLOW_WEBHOOK_TOKEN is required}
      GOOGLE_ADS_WEBHOOK_TOKEN: ${GOOGLE_ADS_WEBHOOK_TOKEN:?GOOGLE_ADS_WEBHOOK_TOKEN is required}
      GOOGLE_ADS_WEBHOOK_KEY: ${GOOGLE_ADS_WEBHOOK_KEY:?GOOGLE_ADS_WEBHOOK_KEY is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      CRM_PUBLIC_URL: ${CRM_PUBLIC_URL:-https://crm.onpointoffices.co.za}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.blend-crm.rule=Host(`crm.onpointoffices.co.za`)
      - traefik.http.routers.blend-crm.entrypoints=websecure
      - traefik.http.routers.blend-crm.tls=true
      - traefik.http.routers.blend-crm.tls.certresolver=mytlschallenge
      - traefik.http.services.blend-crm.loadbalancer.server.port=3000
    networks:
      - default
      - traefik

networks:
  traefik:
    external: true
    name: root_default

volumes:
  postgres_data:
    name: blend-crm-postgres-data
